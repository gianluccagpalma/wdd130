<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
      content="Contact Down The River with questions about rafting trips. Find our contact details, location map, team, and inquiry form.">
    <meta name="author" content="Gianlucca Palma">
    <link rel="stylesheet" href="styles/rafting.css">
    <title>Down The River | Contact Us</title>
</head>

<body>

    <header>
        <img src="images/downriver.png" alt="Down The River logo">
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="trips.html">Trips</a></li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <div class="hero2">
            <h1>Contact Down The River</h1>
            <div class="contact-details">
                <p>123 Main River Street</p>
                <p>Kolob, California</p>
                <p>+1 999 999 9999</p>
                <p>info@downtheriver.com</p>
            </div>
        </div>
        <section class="grid_map">
            <h2>Find Us</h2>
            <iframe title="Down The River location map"
              src="https://www.google.com/maps/embed?pb=!1m14!1m12!1m3!1d3555.3216635410868!2d31.373674889760238!3d26.988372719326286!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!5e0!3m2!1sen!2sbr!4v1790781690515!5m2!1sen!2sbr"
              referrerpolicy="strict-origin-when-cross-origin"></iframe>
        </section>
        <section class="grid_form">
            <h2>Contact Us</h2>

            <form action="#">

                <label for="q1">Name</label>
                <input type="text" name="name" id="q1" placeholder="Your name" autocomplete="name">

                <label for="q2">Email</label>
                <input type="email" name="email" id="q2" placeholder="Your email address" autocomplete="email">

                <p>Message Purpose</p>

                <label>
                    <input type="radio" name="purpose" id="p1" value="general">
                    General Inquiry
                </label>

                <label>
                    <input type="radio" name="purpose" id="p2" value="reservation">
                    Reservation Question
                </label>

                <label>
                    <input type="radio" name="purpose" id="p3" value="website">
                    Website Suggestion
                </label>

                <label for="message">Message</label>
                <textarea id="message" name="message" placeholder="Type here"></textarea>

                <label>
                    <input type="checkbox" id="checkbox" name="newsletter">
                    Please subscribe me to the monthly newsletter
                </label>

                <button type="submit">Get in Touch!</button>

            </form>

        </section>
        <section class="grid_employee">
            <h2>We are here to serve you</h2>

            <figure>
                <img src="images/john.jpg" alt="John">
                <figcaption>John</figcaption>
            </figure>

            <figure>
                <img src="images/robert.jpg" alt="Robert">
                <figcaption>Robert</figcaption>
            </figure>

            <figure>
                <img src="images/lia.jpg" alt="Lia">
                <figcaption>Lia</figcaption>
            </figure>
        </section>
    </main>
    <footer>
        <p>&copy;2026 Down The River - Gianlucca Palma</p>
        <nav class="socialmedia">
            <a href="https://facebook.com">
                <img src="images/facebook.png" alt="Facebook Icon">
            </a>
            <a href="https://linkedin.com">
                <img src="images/linkedin.png" alt="LinkedIn Icon">
            </a>
            <a href="https://instagram.com">
                <img src="images/instagram.png" alt="Instagram Icon">
            </a>
        </nav>
    </footer>
</body>

</html>
