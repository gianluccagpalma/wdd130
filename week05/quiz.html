<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML/CSS Quiz</title>
    <link rel="stylesheet" href="styles/quiz.css">
</head>

<header>
    <h1>WELCOME TO HTML/CSS QUIZ!</h1>
</header>

<body>

    <form>
        <fieldset>
            <legend>Question 1</legend>
            <label for="q1">In CSS, the property used to change the text color of an element is
                ________________.</label><br>
            <input type="text" name="q1" id="q1" placeholder="Enter CSS property">
        </fieldset>

        <br>

        <fieldset>
            <legend>Question 2</legend>
            <label for="q2">Explain the difference between <code>display: inline</code> and
                <code>display: block</code> in CSS.</label><br>
            <textarea name="q2" id="q2" rows="4" cols="50"
              placeholder="Type your answer here..."></textarea>
        </fieldset>

        <br>

        <fieldset>
            <legend>Question 3</legend>
            <label for="q3">Which HTML tag is used to define an internal style sheet?</label><br>
            <select name="q3" id="q3">
                <option value="" selected disabled>Choose One ...</option>
                <option value="css">&lt;css&gt;</option>
                <option value="style">&lt;style&gt;</option>
                <option value="script">&lt;script&gt;</option>
            </select>
        </fieldset>

        <br>

        <fieldset>
            <legend>Question 4</legend>
            <label for="q4">How many total levels of HTML headings exist (from
                <code>&lt;h1&gt;</code> to
                <code>&lt;h6&gt;</code>)?</label><br>
            <input type="number" name="q4" id="q4" min="1" max="10">
        </fieldset>

        <br>

        <button type="submit">Submit Quiz</button>

    </form>
</body>

</html>
